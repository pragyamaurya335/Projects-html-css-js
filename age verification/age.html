<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>age verification</title>
    <link rel="stylesheet" href="age.css">
</head>

<body>
    <div class="container" >
        <h1>You Must Verify Age Before Getting Acess</h1>
        <button id="verifybtn">Verify</button>
    </div>
    <div class="pop">
        <h2>LOGIN PAGE</h2>
        <form id="agever">
            <label for="">what is your age</label>
            <input type="age" placeholder="19" id="age">
            <label for="">Are you laying</label>
            <input type="yesno" placeholder="no">
            <button type="submit">Verify</button>
        </form>
        <div class="show">
            <h5 id="ok">you are allowed</h5>
            <h5 id="notok">sorry,you are not allowed</h5>
        </div>
    </div>



    <script src="age.js"></script>
</body>

</html>
