      </div>
    </div>

    <div class="app-backdrop" aria-hidden="true"></div>

    <aside class="menu-panel" aria-label="Main navigation">
      <div class="menu-header">
        <div class="avatar">SR</div>
        <div>
          <div class="menu-label">Student access</div>
          <h3>Samira R.</h3>
        </div>
      </div>

      <nav class="menu-nav">
        <a class="menu-item" href="profile.html">
          <span>Profile</span>
          <em>your details</em>
        </a>
        <a class="menu-item" href="correct-us.html">
          <span>Correct Us</span>
          <em>report a room issue</em>
        </a>
        <a class="menu-item" href="about.html">
          <span>About</span>
          <em>team and contact</em>
        </a>
        <a class="menu-item" href="logout.html">
          <span>Logout</span>
          <em>sign out</em>
        </a>
      </nav>

      <div class="menu-footer">
        <p>Need help?</p>
        <a href="mailto:hello@openroom.app">hello@openroom.app</a>
      </div>
    </aside>

    <header class="navbar">
      <button class="menu-btn" aria-label="Open menu">✱</button>

      <div class="brand">
        <a href="mainpage.html" class="logo">OpenRoom</a>
      </div>
    </header>

    <main class="hero">
      <div class="hero-heading">
        <h1>Find <strong>THE Place To Be</strong></h1>
        <p>Choose your block</p>
      </div>

      <section class="places" id="places">
        <a href="rooms.html?block=01" class="place-card" data-place="01">
          <span class="card-number">01</span>
          <span class="card-name">Block One</span>
          <span class="card-arrow">↗</span>
        </a>

        <a href="rooms.html?block=02" class="place-card" data-place="02">
          <span class="card-number">02</span>
          <span class="card-name">Block Two</span>
          <span class="card-arrow">↗</span>
        </a>

        <a href="rooms.html?block=03" class="place-card" data-place="03">
          <span class="card-number">03</span>
          <span class="card-name">Block Three</span>
          <span class="card-arrow">↗</span>
        </a>

        <a href="rooms.html?block=04" class="place-card" data-place="04">
          <span class="card-number">04</span>
          <span class="card-name">Block Four</span>
          <span class="card-arrow">↗</span>
        </a>
      </section>
    </main>

    <footer class="footer">
      <button class="correct-us" type="button" onclick="window.location.href='correct-us.html'">
        Correct us
      </button>
    </footer>

    <script src="mainpage.js"></script>
